<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumio – Hong Kong Insurance</title>
<meta name="description" content="Ask insurance questions in plain language. Education only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111827;
    --muted: #6B7280;
    --soft: #9CA3AF;
    --accent: #EC2951;
    --accent-dark: #C41E45;
    --line: #E5E7EB;
    --bot: #F9FAFB;
    --user: #F3F4F6;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px 8px;
    border-bottom: 1px solid var(--line);
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .sub {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .chip {
    background: var(--user);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
  }
  .chip:hover { background: #e5e7eb; }
  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 120px;
  }
  .msg { margin: 12px 0; }
  .msg.user { text-align: right; }
  .msg.user .bubble {
    background: var(--accent);
    color: #fff;
    display: inline-block;
    border-radius: 18px 18px 4px 18px;
    padding: 10px 16px;
    text-align: left;
  }
  .msg.bot .bubble {
    background: var(--bot);
    border: 1px solid var(--line);
    border-radius: 4px 18px 18px 18px;
    padding: 12px 16px;
  }
  .bubble { word-wrap: break-word; }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 8px 0; padding-left: 20px; }
  .bubble li { margin: 4px 0; }
  .meta {
    font-size: 11px;
    color: var(--soft);
    margin-top: 8px;
  }
  .feedback { margin-top: 6px; font-size: 12px; }
  .feedback button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
  }
  .composer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 12px 16px 20px;
    max-width: 720px;
    margin: 0 auto;
  }
  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  #input {
    flex: 1;
    min-height: 44px;
    max-height: 160px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 22px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.4;
    overflow-y: auto;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 6px;
    height: 6px;
    background: var(--soft);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--soft);
    padding: 8px 20px 16px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Lumio</h1>
    <p class="sub">Ask anything about insurance in Hong Kong. I explain what to look for, using public information. Education only, not advice.</p>
  </header>

  <div class="chips" id="chips">
    <button class="chip" data-q="What should I check before buying car insurance?">Car</button>
    <button class="chip" data-q="What should I check before buying health insurance?">Health</button>
    <button class="chip" data-q="What is VHIS?">VHIS</button>
    <button class="chip" data-q="Is helper insurance compulsory?">Helper</button>
    <button class="chip" data-q="What should I look for before buying travel insurance?">Travel</button>
    <button class="chip" data-q="What is HSBC Life Health Pass?">Health Pass</button>
    <button class="chip" data-q="I am 80 years old, what should I do before buying insurance?">Age 80</button>
  </div>

  <div id="thread"></div>

  <div class="composer">
    <form id="form">
      <div class="input-row">
        <textarea id="input" placeholder="Ask anything about insurance in Hong Kong…" rows="1"></textarea>
        <button type="submit" id="send" aria-label="Send">↑</button>
      </div>
    </form>
    <footer>Education only. Always confirm with your insurer.</footer>
  </div>
</div>

<script src="kb.js"></script>
<script>
const PROXY_URL = '/api/proxy';

const SOURCE_NAMES = {
  S1: 'Insurance Authority',
  S2: 'VHIS Office',
  S3: 'Inland Revenue Department',
  S4: 'HKFI',
  S5: 'Insurance Complaints Bureau',
  S6: 'Labour Department',
  S7: 'Consumer Council',
  S8: 'General insurance references',
  S9: 'HK Observatory',
  S10: 'IFEC',
  S11: 'Motor Insurers Bureau',
  S12: 'MPFA',
  S16: 'Hospital Authority',
  S20: 'Insurer / product pages',
  S21: 'Deposit Protection Scheme',
  S22: 'Department of Health',
  S23: 'Social Welfare Department'
};

const SECTION_HINTS = {
  'helper': 'Domestic Helper Insurance',
  'helpers': 'Domestic Helper Insurance',
  'domestic': 'Domestic Helper Insurance',
  'vhis': 'Health and Medical Insurance, including VHIS',
  'medical': 'Health and Medical Insurance, including VHIS',
  'health': 'Health and Medical Insurance, including VHIS',
  'hospital': 'Health and Medical Insurance, including VHIS',
  'car': 'Car',
  'motor': 'Car',
  'vehicle': 'Car',
  'home': 'Home and Property Insurance',
  'contents': 'Home and Property Insurance',
  'typhoon': 'Home and Property Insurance',
  'travel': 'Travel Insurance',
  'travelling': 'Travel Insurance',
  'flying': 'Travel Insurance',
  'flight': 'Travel Insurance',
  'critical': 'Critical Illness Insurance',
  'illness': 'Critical Illness Insurance',
  'life': 'Life and Savings Insurance',
  'education': 'Life and Savings Insurance',
  'savings': 'Life and Savings Insurance',
  'claim': 'Claims and Complaints',
  'claiming': 'Claims and Complaints',
  'health pass': 'Health Pass',
  'healthpass': 'Health Pass',
  'blua': 'Health Pass',
  'socare': 'Health Pass',
  'mixcare': 'Health Pass',
  'hsbc life health pass': 'Health Pass'
};

const FOLLOWUP = /^(and|also|but|so|then|what about|how about|which one|it|that|those|they|them|i |i'm |i am |i have |i smoke|i vape|i drink|smoke|vape)\b/i;

let history = [];
let currentTopic = '';
const MAX_TURNS = 6;

function escapeHTML(s) {
  const amp = String.fromCharCode(38) + 'amp;';
  const lt = String.fromCharCode(38) + 'lt;';
  const gt = String.fromCharCode(38) + 'gt;';
  const quot = String.fromCharCode(38) + 'quot;';
  return String(s)
    .replace(/&/g, amp)
    .replace(/</g, lt)
    .replace(/>/g, gt)
    .replace(/"/g, quot);
}

function formatAnswer(text) {
  let t = escapeHTML(text);
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\n\n/g, '</p><p>');
  if (t.includes('\n- ')) {
    t = t.replace(/\n- /g, '</p><ul><li>').replace(/\n(?=<li>)/g, '</li><li>') + '</ul>';
  }
  return '<p>' + t + '</p>';
}

function cjkBigrams(s) {
  const out = [];
  const re = /[\u4e00-\u9fff]{2,}/g;
  let m;
  while ((m = re.exec(s))) {
    for (let i = 0; i < m[0].length - 1; i++) out.push(m[0].slice(i, i + 2));
  }
  return out;
}

function tokens(s) {
  const eng = (s.toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => w.length > 2 || /^\d+$/.test(w));
  return eng.concat(cjkBigrams(s));
}

function score(entry, q, preferred) {
  const words = tokens(q);
  if (!words.length) return 0;
  const text = (entry.q + ' ' + entry.a + ' ' + (entry.q_tc || '')).toLowerCase();
  const padded = ' ' + text.replace(/[^a-z0-9\u4e00-\u9fff]+/g, ' ') + ' ';
  let s = 0;
  for (const w of words) {
    if (padded.indexOf(' ' + w + ' ') !== -1) s += 1;
    else if (/^\d+$/.test(w) && text.indexOf(w) !== -1) s += 1;
  }
  if (preferred && entry.section && entry.section.indexOf(preferred) !== -1) s += 5;
  return s;
}

function detectSection(q) {
  const l = q.toLowerCase();
  let best = null, bestLen = 0;
  for (const [k, sec] of Object.entries(SECTION_HINTS)) {
    if (k.length < bestLen) continue;
    const re = new RegExp('(^|[^a-z])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + 's?' + '([^a-z]|$)', 'i');
    if (re.test(l) || (k.length >= 6 && l.indexOf(k) !== -1)) {
      if (k.length > bestLen) { best = sec; bestLen = k.length; }
    }
  }
  return best;
}

function detectAge(q) {
  const m = q.match(/\b(\d{2})\s*(?:years?\s*old|year.?old|yo|歲)?\b/i) || q.match(/\bi am (\d{2})\b/i);
  return m ? parseInt(m[1], 10) : null;
}

function retrieve(q, n = 5) {
  let preferred = detectSection(q);
  const age = detectAge(q);
  if (!preferred && age && age >= 60) preferred = 'Health and Medical Insurance, including VHIS';

  const pool = preferred
    ? KB.filter(e => e.status !== 'R' && e.section && e.section.indexOf(preferred) !== -1)
    : KB.filter(e => e.status !== 'R');

  const minScore = tokens(q).length <= 2 ? 1 : 2;
  const scored = pool.map(e => ({ e, s: score(e, q, preferred) }))
    .filter(x => x.s >= minScore)
    .sort((a, b) => b.s - a.s);

  const seen = new Set();
  const out = [];
  for (const x of scored) {
    const key = x.e.q.slice(0, 40);
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(x.e);
    if (out.length >= n) break;
  }
  return out;
}

function retrievalQuery(q) {
  const trimmed = q.trim();
  const wordCount = trimmed.split(/\s+/).filter(Boolean).length;
  if (currentTopic && (FOLLOWUP.test(trimmed) || wordCount <= 4)) {
    return currentTopic + ' ' + q;
  }
  return q;
}

function add(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'user') {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = formatAnswer(text);
  }
  div.appendChild(bubble);
  if (role === 'bot') {
    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.innerHTML = '<button title="Helpful">👍</button><button title="Not helpful">👎</button>';
    div.appendChild(fb);
  }
  document.getElementById('thread').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

async function ask(q) {
  const rq = retrievalQuery(q);
  const matches = retrieve(rq, 5);
  const absThreshold = rq.trim().split(/\s+/).filter(Boolean).length <= 2 ? 1 : 2;

  if (!matches.length || score(matches[0], rq, detectSection(rq)) < absThreshold) {
    add('I do not have enough verified information on that specific point.\n\nTry asking about a specific cover — VHIS, helper, travel, home, car, life, or critical illness.', 'bot');
    return;
  }

  currentTopic = matches[0].q.split(' ').slice(0, 6).join(' ');

  const context = matches.map(m => {
    const tag = m.status === 'P' ? ' [Partial]' : '';
    return 'Topic: ' + m.q + tag + '\nInformation: ' + m.a;
  }).join('\n\n');

  const system = `You are Lumio, an education-only Hong Kong insurance assistant. Use ONLY the information below. Never invent facts. Never recommend a specific product or insurer. If the information says it depends on the policy, say so. Match the depth to the source. Do not pad. If insufficient, say so plainly. End every answer with: "Check the exact terms with the insurer."

If the user mentions an age of 70 or above and eligibility is relevant, state any maximum entry age range from the information at the top.

Do not say "the previous answer was about X". Just answer the current question using the context.

Information:
${context}`;

  const messages = [
    { role: 'system', content: system },
    ...history.slice(-MAX_TURNS * 2),
    { role: 'user', content: q }
  ];

  const bubble = document.createElement('div');
  bubble.className = 'msg bot';
  bubble.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  document.getElementById('thread').appendChild(bubble);
  bubble.scrollIntoView({ behavior: 'smooth' });

  try {
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Token': new URLSearchParams(location.search).get('k') || ''
      },
      body: JSON.stringify({ messages, model: 'deepseek-chat', temperature: 0.2, max_tokens: 800 })
    });
    if (!res.ok) throw new Error('proxy');
    const data = await res.json();
    const answer = data.choices?.[0]?.message?.content || 'No response.';
    const sources = [...new Set(matches.flatMap(m => (m.sources || '').split(';').filter(Boolean)))].sort();
    const sourceLine = sources.map(s => SOURCE_NAMES[s] || s).join(', ');
    bubble.querySelector('.bubble').innerHTML = formatAnswer(answer) +
      '<div class="meta">Based on: ' + escapeHTML(sourceLine) + '</div>';
    history.push({ role: 'user', content: q }, { role: 'assistant', content: answer });
    if (history.length > MAX_TURNS * 2) history = history.slice(-MAX_TURNS * 2);
  } catch (e) {
    bubble.querySelector('.bubble').innerHTML = '<p>Connection problem. Check your internet and try again.</p>';
  }
}

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('input');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  input.style.height = 'auto';
  add(q, 'user');
  await ask(q);
};

document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

document.getElementById('chips').onclick = (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  const q = btn.dataset.q;
  document.getElementById('input').value = q;
  document.getElementById('form').dispatchEvent(new Event('submit'));
};

add('Hi! Ask me anything about insurance in Hong Kong — coverage, claims, tax, helper, travel, or how policies work. I will keep answers clear and grounded.\n\nEducation only, not personal advice. Always confirm with your insurer.', 'bot');
</script>
</body>
</html>
